# Actual-OS captures of the five Batch 1 tabs. PREFIX (e.g. android-dark-) is passed with -e.
# The first tap after a cold start can be lost on a slow simulator/emulator, so each tab switch is a tap+expected-target pair retried up to 3 times (tab taps are idempotent).
appId: com.glambeauty.analyzereview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: home-analyze
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}home
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: tab-analyze
      - extendedWaitUntil:
          visible:
            id: analyze-start
          timeout: 8000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}GL-017
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: tab-studio
      - extendedWaitUntil:
          visible:
            id: studio-choose
          timeout: 8000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}GL-035
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: tab-discover
      - extendedWaitUntil:
          visible:
            id: discover-follow
          timeout: 8000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}GL-069
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: tab-profile
      - extendedWaitUntil:
          visible:
            id: profile-roles
          timeout: 8000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}GL-117
