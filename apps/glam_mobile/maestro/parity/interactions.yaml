# Actual-OS navigation and interaction checks for the five Batch 1 tabs.
# Every step waits (20s) for its target: software-GPU emulators render the first photo screens slowly.
# Unbuilt destinations must open their honest pending screen carrying the design ID.
appId: com.glambeauty.analyzereview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: home-analyze
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: home-try
    timeout: 20000
- tapOn:
    id: home-try
- extendedWaitUntil:
    visible:
      id: studio-choose
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 20000
- tapOn:
    id: tab-home
- extendedWaitUntil:
    visible:
      id: home-analyze
    timeout: 20000
- tapOn:
    id: home-analyze
- extendedWaitUntil:
    visible:
      id: analyze-start
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: analyze-start
    timeout: 20000
- tapOn:
    id: analyze-start
- extendedWaitUntil:
    visible: 'GL-018.*'
    timeout: 20000
- extendedWaitUntil:
    visible: '.*not built in the native app yet.*'
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: pending-back
    timeout: 20000
- tapOn:
    id: pending-back
- extendedWaitUntil:
    visible:
      id: analyze-start
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: tab-studio
    timeout: 20000
- tapOn:
