# Android system Back returns from a pushed design screen to the originating tab.
appId: com.glambeauty.analyzereview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: home-analyze
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: tab-studio
    timeout: 20000
- tapOn:
    id: tab-studio
- extendedWaitUntil:
    visible:
      id: studio-choose
    timeout: 20000
- tapOn:
    id: studio-choose
- extendedWaitUntil:
    visible: 'GL-036.*'
    timeout: 20000
- back
- extendedWaitUntil:
    visible:
      id: studio-choose
    timeout: 20000
