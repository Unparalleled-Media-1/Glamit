appId: com.glambeauty.analyzereview
---
- launchApp:
    clearState: true
    permissions:
      camera: unset
- extendedWaitUntil:
    visible:
      id: home-analyze
    timeout: 45000
- waitForAnimationToEnd
# The first tap after a cold start can be lost on a slow emulator/simulator: tap + expected target, retried (taps are idempotent).
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: tab-analyze
      - extendedWaitUntil:
          visible:
            id: analyze-start
          timeout: 8000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: analyze-start
      - extendedWaitUntil:
          visible:
            id: 'screen-GL-018'
          timeout: 8000
- takeScreenshot: 00-gl018-choose-analysis
- retry:
    maxRetries: 3
    commands:
      - tapOn: 'Continue'
      - extendedWaitUntil:
          visible: 'Open camera'
          timeout: 8000
- takeScreenshot: 00-gl019-before-you-start
- tapOn: 'Open camera'
- extendedWaitUntil:
    visible:
      id: 'camera-source-error|native-camera-live'
    timeout: 45000
- takeScreenshot: 01-camera-entry
- takeScreenshot: 02-native-camera-capability
- tapOn: 'Photo library'
- extendedWaitUntil:
    visible: 'Cancel'
    timeout: 30000
- takeScreenshot: 06-native-photo-picker
- tapOn:
    text: '(?s)Photo,.*'
    index: 0
- extendedWaitUntil:
    visible:
      id: native-photo-review
    timeout: 30000
- takeScreenshot: 03-library-photo-review
- tapOn: 'Analyze this photo'
- assertVisible:
    id: auth-unconfigured
- takeScreenshot: 04-connection-blocker
- tapOn: 'Close sign-in'
- swipe:
    start: '1%,45%'
    end: '85%,45%'
    duration: 500
- extendedWaitUntil:
    visible:
      id: native-shutter
    timeout: 10000
- takeScreenshot: 05-native-return
