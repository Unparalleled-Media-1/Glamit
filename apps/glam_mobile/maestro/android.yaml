appId: com.glambeauty.analyzereview
---
- launchApp:
    clearState: true
    permissions:
      camera: unset
- tapOn:
    id: tab-analyze
- tapOn:
    id: analyze-start
- takeScreenshot: 00-gl018-choose-analysis
- tapOn: 'Continue'
- takeScreenshot: 00-gl019-before-you-start
- tapOn: 'Open camera'
- runFlow:
    when:
      visible: 'While using the app'
    commands:
      - tapOn: 'While using the app'
- extendedWaitUntil:
    visible:
      id: native-camera-live
    timeout: 45000
- takeScreenshot: 01-camera-entry
- takeScreenshot: 02-device-camera
- tapOn:
    id: native-shutter
- extendedWaitUntil:
    visible:
      id: native-photo-review
    timeout: 30000
- takeScreenshot: 03-captured-photo
- tapOn: 'Analyze this photo'
- assertVisible:
    id: auth-unconfigured
- takeScreenshot: 04-connection-blocker
- back
- assertVisible:
    id: native-photo-review
- tapOn: 'Retake'
- assertVisible:
    id: native-shutter
- takeScreenshot: 05-native-return
