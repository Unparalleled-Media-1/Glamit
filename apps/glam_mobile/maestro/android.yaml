appId: com.glambeauty.analyzereview
---
- launchApp:
    clearState: true
    permissions:
      camera: unset
- extendedWaitUntil:
    visible:
      id: home-analyze
    timeout: 45000
- waitForAnimationToEnd
# The first tap after a cold start can be lost on a slow emulator/simulator: tap + expected target, retried (taps are idempotent).
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: tab-analyze
      - extendedWaitUntil:
          visible:
            id: analyze-start
          timeout: 8000
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: analyze-start
      - extendedWaitUntil:
          visible:
            id: 'screen-GL-018'
          timeout: 8000
- takeScreenshot: 00-gl018-choose-analysis
- retry:
    maxRetries: 3
    commands:
      - tapOn: 'Continue'
      - extendedWaitUntil:
          visible: 'Open camera'
          timeout: 8000
- takeScreenshot: 00-gl019-before-you-start
- tapOn: 'Open camera'
- runFlow:
    when:
      visible: 'While using the app'
    commands:
      - tapOn: 'While using the app'
- extendedWaitUntil:
    visible:
      id: native-camera-live
    timeout: 45000
- takeScreenshot: 01-camera-entry
- takeScreenshot: 02-device-camera
- tapOn:
    id: native-shutter
- extendedWaitUntil:
    visible:
      id: native-photo-review
    timeout: 30000
- takeScreenshot: 03-captured-photo
- tapOn: 'Analyze this photo'
- assertVisible:
    id: auth-unconfigured
- takeScreenshot: 04-connection-blocker
- back
- assertVisible:
    id: native-photo-review
- tapOn: 'Retake'
- assertVisible:
    id: native-shutter
- takeScreenshot: 05-native-return
