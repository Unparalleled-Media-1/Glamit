name: glam_mobile
description: GLAM Beauty controlled native Analyze restart.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.9'
dependencies:
  flutter:
    sdk: flutter
  camera: 0.12.2
  image_picker: 1.2.4
  flutter_secure_storage: 11.2.0
  http: 1.6.0
  crypto: 3.0.8
  uuid: 4.6.0
  path_provider: 2.1.6
  go_router: 18.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/imagery/
  fonts:
    # Reference typography is Georgia (display) and Arial (body). Neither is
    # redistributable, so metric-compatible SIL OFL substitutes are bundled:
    # Gelasio (Georgia) and Arimo (Arial). See assets/fonts/*-OFL.txt.
    - family: Gelasio
      fonts:
        - asset: assets/fonts/Gelasio.ttf
    - family: Arimo
      fonts:
        - asset: assets/fonts/Arimo.ttf
        - asset: assets/fonts/Arimo.ttf
          weight: 700
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app-icon.png
  remove_alpha_ios: true
  background_color_ios: '#191619'
