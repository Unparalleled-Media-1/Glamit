name: glam_mobile
description: GLAM Beauty controlled native Analyze restart.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.9'
dependencies:
  flutter:
    sdk: flutter
  camera: 0.12.2
  image_picker: 1.2.4
  flutter_secure_storage: 11.2.0
  http: 1.6.0
  crypto: 3.0.8
  uuid: 4.6.0
  path_provider: 2.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4
flutter:
  uses-material-design: true
  fonts:
    - family: GlamSymbols
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
  assets:
    - assets/brand/
    - assets/imagery/
    - assets/icons/
    - assets/screens/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app-icon.png
  remove_alpha_ios: true
  background_color_ios: '#191619'
