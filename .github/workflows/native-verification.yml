name: Native build verification
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/native-verification.yml'
      - 'scripts/mobile/**'
      - 'tests/native_device/**'
  workflow_dispatch:
    inputs:
      device_journey:
        description: 'Run isolated native photo/Passport UI acceptance (never production)'
        type: boolean
        default: false
      enrollment_probe:
        description: 'Diagnose only virtual Android biometric enrollment; not app acceptance'
        type: boolean
        default: false
      platform:
        description: 'Affected native platform to verify'
        type: choice
        options: [both, ios, android]
        default: both
permissions:
  contents: read
concurrency:
  group: native-verification-${{ github.event.pull_request.number || github.ref }}-${{ inputs.platform || 'both' }}-${{ inputs.enrollment_probe && 'enrollment' || inputs.device_journey && 'device' || 'startup' }}
  cancel-in-progress: true
env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  GLAM_BUILD_ENV: development
  # Local verification IDs only; never registered/published by this workflow.
  GLAM_IOS_BUNDLE_IDENTIFIER: com.glambeauty.localverification
  GLAM_ANDROID_PACKAGE: com.glambeauty.localverification
  GLAM_NATIVE_DEVICE_JOURNEY: ${{ inputs.device_journey && 'true' || 'false' }}
  EXPO_PUBLIC_GLAM_API_ORIGIN: ${{ inputs.device_journey && 'https://native-fixture.invalid' || '' }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ inputs.device_journey && 'sb_publishable_nativefixture0000000000000000' || '' }}
jobs:
  ios-simulator:
    name: ${{ inputs.device_journey && 'iOS isolated core and relaunch' || 'ios-simulator' }}
    if: ${{ !inputs.enrollment_probe && (!inputs.platform || inputs.platform == 'both' || inputs.platform == 'ios') }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: node scripts/ci/frozen-install.mjs node
      - run: npm run test:native-photo
      - run: npm run test:analyze-capture
      - run: npm run test:native-reskin
      - run: npm run test:native-stylist
      - run: npm run test:native-photos
      - run: npm run test:device-fixture
      - uses: astral-sh/setup-uv@v7
        if: inputs.device_journey
      - uses: actions/setup-java@v6
        if: inputs.device_journey
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare isolated native device services
        if: inputs.device_journey
        run: python3 scripts/mobile/run_logged.py artifacts/native-device/setup.txt bash tests/native_device/setup-services.sh
      - name: Generate actual iOS native project
        run: npm exec --workspace=@glam/mobile -- expo prebuild --platform ios --no-install
      - name: Permit loopback in this isolated fixture binary only
        if: inputs.device_journey
        run: node tests/native_device/prepare-build.mjs --native-permissions ios
      - name: Install CocoaPods dependencies from the native project root
        working-directory: apps/mobile/ios
        run: python3 ../../../scripts/mobile/run_logged.py ../../../artifacts/native-ios/pods.txt pod install
      - name: Compile and boot unsigned simulator application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-ios
          xcodebuild -version > artifacts/native-ios/toolchain.txt
          xcrun simctl list devices available --json > artifacts/native-ios/simulators.json
          simulator_id=$(jq -r '[.devices[][] | select(.isAvailable and (.name | startswith("iPhone")))][0].udid // empty' artifacts/native-ios/simulators.json)
          test -n "$simulator_id"
          simulator_state=$(jq -r --arg id "$simulator_id" '.devices[][] | select(.udid == $id) | .state' artifacts/native-ios/simulators.json)
          if [ "$simulator_state" != Booted ]; then xcrun simctl boot "$simulator_id"; fi
          xcrun simctl bootstatus "$simulator_id" -b
          workspace=$(find apps/mobile/ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$workspace"
          xcodebuild -list -json -workspace "$workspace" > artifacts/native-ios/workspace.json
          project=$(find apps/mobile/ios -maxdepth 1 -name '*.xcodeproj' -print -quit)
          test -n "$project"
          scheme=$(basename "$project" .xcodeproj)
          jq -e --arg scheme "$scheme" '.workspace.schemes | index($scheme) != null' artifacts/native-ios/workspace.json
          python3 scripts/mobile/run_logged.py artifacts/native-ios/build.txt xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphonesimulator -destination "platform=iOS Simulator,id=$simulator_id" -derivedDataPath /tmp/glam-native-ios CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=YES
          app_bundle=$(find /tmp/glam-native-ios/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app_bundle"
          ditto -c -k --sequesterRsrc --keepParent "$app_bundle" artifacts/native-ios/unsigned-simulator-app.zip
          xcrun simctl install "$simulator_id" "$app_bundle"
          xcrun simctl launch "$simulator_id" com.glambeauty.localverification | tee artifacts/native-ios/launch.txt
          sleep 10
          xcrun simctl io "$simulator_id" screenshot artifacts/native-ios/home.png
          git rev-parse HEAD > artifacts/native-ios/source-sha.txt
      - name: Exercise installed iOS photo to Passport journey
        if: inputs.device_journey
        run: |
          python3 scripts/mobile/run_logged.py artifacts/native-device/journey-log.txt bash tests/native_device/run-journey.sh ios
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: actual-ios-simulator-build-and-startup
          path: |
            artifacts/native-ios
            artifacts/native-device
            artifacts/native-fixture-build.json
          if-no-files-found: warn
  android-emulator:
    name: ${{ inputs.device_journey && 'Android isolated core and relaunch' || 'android-emulator' }}
    if: ${{ !inputs.enrollment_probe && (!inputs.platform || inputs.platform == 'both' || inputs.platform == 'android') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-android
          test -d "$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          python3 scripts/mobile/run_logged.py artifacts/native-android/sdk.txt "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - run: node scripts/ci/frozen-install.mjs node
      - run: npm run test:native-photo
      - run: npm run test:analyze-capture
      - run: npm run test:native-reskin
      - run: npm run test:native-stylist
      - run: npm run test:native-photos
      - run: npm run test:device-fixture
      - uses: astral-sh/setup-uv@v7
        if: inputs.device_journey
      - uses: actions/setup-java@v6
        if: inputs.device_journey
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare isolated native device services
        if: inputs.device_journey
        run: python3 scripts/mobile/run_logged.py artifacts/native-device/setup.txt bash tests/native_device/setup-services.sh
      - name: Generate actual Android native project
        run: npm exec --workspace=@glam/mobile -- expo prebuild --platform android --no-install
      - name: Permit loopback in this isolated fixture binary only
        if: inputs.device_journey
        run: node tests/native_device/prepare-build.mjs --native-permissions android
      - name: Install compile SDK and NDK
        run: python3 scripts/mobile/run_logged.py artifacts/native-android/sdk-install.txt sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Compile local verification APK with bundled JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-android
          cd apps/mobile/android
          python3 ../../../scripts/mobile/run_logged.py ../../../artifacts/native-android/build.txt ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64,arm64-v8a --no-daemon --max-workers=2
          sha256sum app/build/outputs/apk/release/app-release.apk > ../../../artifacts/native-android/apk-sha256.txt
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and capture actual Android app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.glambeauty.localverification/.MainActivity
            sleep 10
            adb shell pidof com.glambeauty.localverification
            python3 scripts/mobile/run_logged.py artifacts/native-android/navigation.txt python3 scripts/mobile/android_startup_smoke.py
            adb logcat -d -t 300 ReactNativeJS:E AndroidRuntime:E '*:S' > artifacts/native-android/runtime.txt
            git rev-parse HEAD > artifacts/native-android/source-sha.txt
            if [ "$GLAM_NATIVE_DEVICE_JOURNEY" = true ]; then python3 scripts/mobile/run_logged.py artifacts/native-device/journey-log.txt bash tests/native_device/run-journey.sh android; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: actual-android-apk-and-emulator-startup
          path: |
            artifacts/native-android
            artifacts/native-device
            artifacts/native-fixture-build.json
            apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  android-enrollment-probe:
    name: Android virtual biometric setup (not app acceptance)
    if: inputs.enrollment_probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 scripts/mobile/run_logged.py artifacts/native-device/enrollment.txt python3 tests/native_device/android-enroll.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: virtual-android-enrollment-diagnostics-not-app-acceptance
          path: artifacts/native-device
