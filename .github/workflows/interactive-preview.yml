name: Interactive GLAM preview
on:
  push:
    branches: [feat/interactive-preview]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: glam-interactive-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_OFFLINE: "1"
      PREVIEW_BASE_PATH: /Glamit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck && npm run typecheck:preview
      - run: npm run test:client
      - run: npm run build:preview
      - run: npm ci --ignore-scripts --prefix docs/design-preview
      - run: node docs/design-preview/node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run test:preview
      - run: npm run export --workspace=@glam/mobile
      - run: python scripts/archive-recent-builds.py
      - uses: actions/upload-artifact@v4
        with:
          name: glam-interactive-preview
          path: dist/interactive-preview
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: glam-last-24-hours-source-snapshots
          path: dist/build-snapshots/*.zip
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: glam-ios-android-javascript-exports
          path: apps/mobile/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/interactive-preview
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If automatic enablement is not permitted, a repository administrator must
      # enable Settings > Pages > GitHub Actions once. Never request a user secret.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish the disconnected interactive preview
        id: deployment
        uses: actions/deploy-pages@v5
