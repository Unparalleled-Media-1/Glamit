name: Foundation checks
on:
  pull_request:
  push:
    branches: [feat/platform-foundations, main]
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.paths.outputs.web }}
      mobile: ${{ steps.paths.outputs.mobile }}
      backend: ${{ steps.paths.outputs.backend }}
      edge: ${{ steps.paths.outputs.edge }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select independent build targets
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git hash-object -t tree -w /dev/null)
          fi
          node scripts/ci/targets.mjs "$BASE_SHA" "$HEAD_SHA"
      - run: python3 scripts/ci/check_lockfiles.py
      - run: node --test tests/client/ci-targets.test.mjs
      - run: node scripts/check-railway-config.mjs
      - run: node --test tests/client/railway-build-config.test.mjs tests/client/frozen-install.test.mjs
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_USER: glam
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: glam_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U glam -d glam_test" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      GLAM_TEST_DATABASE_URL: postgresql+psycopg://glam:ci_test_only@127.0.0.1:5432/glam_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: node scripts/ci/frozen-install.mjs python
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: node scripts/ci/frozen-install.mjs node
      - run: uv run --frozen pytest
      - run: uv run --frozen python scripts/export_contracts.py --check
      - run: docker build -f deploy/railway/api.Dockerfile -t glam-beauty-api:deployment-test .
      - run: python scripts/smoke_deployment_images.py --component api
  hosted-api:
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npx --yes deno@2.9.6 fmt --check supabase/functions/glam-api tests/edge
      - run: npx --yes deno@2.9.6 check supabase/functions/glam-api/index.ts
      - run: npx --yes deno@2.9.6 test tests/edge
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: node scripts/ci/frozen-install.mjs node
      - run: npm run check:client-runtime
      - run: npm run test:client
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run contracts:generate
      - run: git diff --exit-code -- packages/contracts
      - run: npm run typecheck --workspace=@glam/web
      - run: npm run build:web
      - run: docker build --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_fixture_public_key_1234 -f deploy/railway/web.Dockerfile -t glam-beauty-web:deployment-test .
      - run: python scripts/smoke_deployment_images.py --component web
      - run: npm ci --ignore-scripts --prefix docs/design-preview
      - run: node docs/design-preview/node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run test:web
      - run: npm run test:photo
      - run: npm run test:golden
      - run: npm run test:connections
      - run: npm run test:hosted-account
      - run: npm run test:creator
      - run: npm run test:artwork
        env:
          GLAM_BRAND_ARTIFACTS: ${{ runner.temp }}/brand-artwork
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brand-artwork-previews
          path: ${{ runner.temp }}/brand-artwork
          if-no-files-found: warn
      - run: npm run test:workspace-access
        env:
          GLAM_WORKSPACE_ARTIFACTS: ${{ runner.temp }}/workspace-access
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workspace-access-evidence
          path: ${{ runner.temp }}/workspace-access
          if-no-files-found: warn
      - run: npm run test:auth-branding
      - run: npm run test:login-hydration
      - run: npm run test:launch-accessibility
      - run: npm run test:launch-keyboard
      - run: npm run test:launch-gates
      - run: npm run test:auth
      - run: npm run test:private-media
      - run: npm run test:ai-stylist
      - run: node --test tests/client/production-web-config.test.mjs
      - run: npm run test:public-config
      - run: npm run typecheck:godaddy
      - name: Build static host package with an explicit public-key fixture
        run: npm run build:godaddy
        env:
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_fixture_public_key_1234
      - run: npm run test:godaddy
      - run: npm run typecheck:preview
      - run: npm run build:preview
        env:
          PREVIEW_BASE_PATH: /Glamit
      - run: npm run test:preview
        env:
          GLAM_DEVICE_PREVIEWS: ${{ runner.temp }}/device-previews
      - run: npm run test:public-footer
        env:
          GLAM_PUBLIC_EVIDENCE: ${{ runner.temp }}/public-footer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-footer-web-screenshots
          path: ${{ runner.temp }}/public-footer
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-android-browser-previews-not-native-builds
          path: ${{ runner.temp }}/device-previews
          if-no-files-found: warn
      - run: node scripts/generate-consumer-tokens.mjs --check
  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: node scripts/ci/frozen-install.mjs node
      - run: npm run typecheck --workspace=@glam/mobile
      - run: npm run test:native-photo
      - run: npm run test:native-stylist
      - run: npm run test:native-photos
      - run: npm run test:client
      - run: node tests/client/mobile-build-config.cjs
      - run: npm run test:auth
      - run: npm run test:private-media
      - run: npm run test:ai-stylist
      - run: npm exec --workspace=@glam/mobile -- expo install --check
      - run: npm run export --workspace=@glam/mobile
      - uses: actions/upload-artifact@v7
        with:
          name: native-javascript-exports-not-store-builds
          path: apps/mobile/dist
  clients:
    if: always()
    needs: [changes, web, mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the aggregate required client check
        env:
          CHANGES: ${{ needs.changes.result }}
          WEB: ${{ needs.web.result }}
          MOBILE: ${{ needs.mobile.result }}
        run: |
          test "$CHANGES" = success
          for result in "$WEB" "$MOBILE"; do
            test "$result" = success || test "$result" = skipped || exit 1
          done
