<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>GLAM AI — Editorial design review</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="design-data.js"></script>
  <script defer src="library-layouts.js"></script>
  <script defer src="screen-catalog.js"></script>
  <script defer src="preview.js"></script>
</head>
<body>
  <a class="skip-link" href="#review-content">Skip design controls</a>
  <header class="review-bar">
    <div class="review-brand"><strong>GLAM AI</strong><span>UI/UX review · Original illustrative assets</span></div>
    <div class="review-controls">
      <label>Surface<select id="surface" aria-label="Design surface"></select></label>
      <label>State<select id="state" aria-label="Preview state"><option value="default">Default</option><option value="loading">Loading</option><option value="empty">Empty</option><option value="error">Error</option><option value="offline">Offline</option><option value="denied">Permission denied</option><option value="success">Success layout</option></select></label>
      <label>Audience<select id="audience" aria-label="Audience layout"><option value="adult">Adult layout</option><option value="teen">Restricted teen</option><option value="child">Guardian / child</option><option value="unknown">Unknown age</option></select></label>
      <label class="check"><input id="wireframe" type="checkbox">Wireframe</label>
      <label class="check"><input id="rtl" type="checkbox">RTL layout</label>
    </div>
  </header>
  <div class="review-notice">Interactive design proposal. Sample imagery; no live catalog, generation, authentication or transactions. Figma-native authoring remains outstanding.</div>
  <main id="review-content" tabindex="-1"></main>
  <div id="dialog-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
